name: LamaStat CI

on:
  push:
    branches: [ main]
  pull_request:
    branches: [ main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang make 

      - name: clone Lama in the root
        run: |
          git clone https://github.com/PLTools/Lama.git Lama

      - name: Build lamastat
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++
          cmake --build build --target lamastat -j$(nproc)

      - name: Build tests and run
        run: |
          cmake --build build --target lamastat-tests -j$(nproc)
          ctest --test-dir build --output-on-failure

      - name: Run lamastat on Sort.bc
        run: |
          ./build/bytecode-statistics/lamastat example/Sort.bc

